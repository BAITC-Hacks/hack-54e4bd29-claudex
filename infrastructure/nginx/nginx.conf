user  nginx;
worker_processes  auto;

error_log  /var/log/nginx/error.log warn;
pid        /var/run/nginx.pid;

events {
    worker_connections  1024;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;

    # Журнал доступа без строки запроса: она может содержать параметры,
    # не предназначенные для журналирования (SECURITY.md, раздел 9.2).
    log_format  medsignal  '$remote_addr "$request_method $uri" $status '
                           '$body_bytes_sent rt=$request_time '
                           'us=$upstream_status urt=$upstream_response_time '
                           'rid=$medsignal_request_id';
    access_log  /var/log/nginx/access.log  medsignal;

    sendfile        on;
    tcp_nopush      on;
    keepalive_timeout  65;

    # Версия сервера наружу не сообщается.
    server_tokens   off;

    # Ограничение размера тела запроса. Импорт выгрузок получает
    # собственный, больший предел в своей локации.
    client_max_body_size 2m;
    client_body_timeout  30s;
    client_header_timeout 15s;

    gzip on;
    gzip_types text/plain text/css application/json application/javascript
               application/xml image/svg+xml;
    gzip_min_length 1024;

    # Ограничение частоты обращений. Значения рассчитаны на локальную
    # разработку; в эксплуатации их задаёт WAF.
    limit_req_zone $binary_remote_addr zone=api_limit:10m rate=20r/s;
    # Same existing rate, separate budget: analytics bursts cannot exhaust
    # ordinary API requests from the same client.
    limit_req_zone $binary_remote_addr zone=analytics_limit:10m rate=20r/s;
    limit_req_zone $binary_remote_addr zone=auth_limit:10m rate=5r/s;
    limit_req_zone $binary_remote_addr zone=import_limit:10m rate=5r/s;

    # Корректное обновление соединения: WebSocket горячей перезагрузки
    # в разработке требует Connection: upgrade, обычные запросы — close.
    map $http_upgrade $connection_upgrade {
        default upgrade;
        ''      close;
    }

    # Идентификатор запроса. Если клиент его не прислал, берётся собственный
    # $request_id nginx, а не пустое значение: иначе краевой журнал нельзя
    # связать с журналом приложения при разборе инцидента.
    map $http_x_request_id $medsignal_request_id {
        default $http_x_request_id;
        ''      $request_id;
    }

    include /etc/nginx/conf.d/*.conf;
}
