# Единственная публичная точка входа.
#
# Наружу не проксируются: PostgreSQL, ClickHouse, Redis, MinIO, MLflow
# и эндпоинт метрик. Они доступны только внутри сети контейнеров
# (SECURITY.md, раздел 2).

upstream medsignal_frontend {
    server frontend:3000;
    keepalive 16;
}

upstream medsignal_backend {
    server backend:8000;
    keepalive 16;
}

upstream medsignal_keycloak {
    server keycloak:8080;
    keepalive 16;
}

server {
    listen 80;
    server_name _;

    # --- Заголовки безопасности --------------------------------------------
    # Дублируют заголовки приложения. Основной рубеж — здесь: он действует
    # и для статики, которую отдаёт не приложение.
    add_header X-Content-Type-Options    "nosniff" always;
    add_header X-Frame-Options           "DENY" always;
    add_header Referrer-Policy           "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy        "geolocation=(), microphone=(), camera=()" always;
    add_header Cross-Origin-Opener-Policy "same-origin" always;

    # Strict-Transport-Security включается вместе с TLS в эксплуатации.
    # В локальной среде без HTTPS он сделал бы сайт недоступным.

    # Идентификатор запроса передаётся дальше. Если клиент его не задал,
    # nginx подставляет собственный, и краевой журнал связывается
    # с журналом приложения по одному значению.
    proxy_set_header X-Request-ID $medsignal_request_id;

    # Любое срабатывание edge rate limit должно отличаться от недоступности
    # upstream. Контракт API и тестовый план требуют 429 + Retry-After.
    limit_req_status 429;
    error_page 429 = @rate_limited;

    location @rate_limited {
        default_type application/json;
        add_header Retry-After "1" always;
        add_header X-Request-ID $medsignal_request_id always;
        # add_header in this location replaces inherited security headers.
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "DENY" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Permissions-Policy "geolocation=(), microphone=(), camera=()" always;
        add_header Cross-Origin-Opener-Policy "same-origin" always;
        return 429 '{"error":{"code":"RATE_LIMIT_EXCEEDED","message":"Превышен лимит запросов","details":{},"request_id":"$medsignal_request_id"}}';
    }

    # --- Служебное ----------------------------------------------------------
    # Метрики недоступны снаружи ни при каких условиях.
    location /metrics {
        return 404;
    }

    location = /healthz {
        access_log off;
        return 200 "ok\n";
        add_header Content-Type text/plain;
    }

    # --- Импорт данных ------------------------------------------------------
    # Отдельный предел размера и частоты: загрузка выгрузок — тяжёлая
    # операция с собственным профилем риска.
    location /api/v1/data/import {
        limit_req zone=import_limit burst=5 nodelay;
        client_max_body_size 256m;
        proxy_read_timeout 120s;

        proxy_pass http://medsignal_backend;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Request-ID      $medsignal_request_id;
    }

    # --- API ----------------------------------------------------------------
    location ^~ /api/v1/analytics/ {
        limit_req zone=analytics_limit burst=40 nodelay;

        proxy_pass http://medsignal_backend;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Request-ID      $medsignal_request_id;
        proxy_set_header Connection        "";

        proxy_connect_timeout 5s;
        proxy_send_timeout    30s;
        proxy_read_timeout    30s;
        proxy_buffering       on;
    }

    location /api/ {
        limit_req zone=api_limit burst=40 nodelay;

        proxy_pass http://medsignal_backend;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Request-ID      $medsignal_request_id;
        proxy_set_header Connection        "";

        proxy_connect_timeout 5s;
        proxy_send_timeout    30s;
        proxy_read_timeout    30s;
        proxy_buffering       on;
    }

    # --- Frontend Auth Callback ---------------------------------------------
    # Страница возврата из OIDC принадлежит фронтенду, а не Keycloak.
    location ^~ /auth/callback {
        proxy_pass http://medsignal_frontend;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade           $http_upgrade;
        proxy_set_header Connection        $connection_upgrade;

        proxy_connect_timeout 5s;
        proxy_read_timeout    60s;
    }

    # --- Keycloak -----------------------------------------------------------
    # Провайдер доступен браузеру по тому же адресу, что и приложение:
    # издатель токена совпадает с тем, что видит пользователь (ADR-0009).
    location /auth/ {
        limit_req zone=auth_limit burst=20 nodelay;

        proxy_pass http://medsignal_keycloak;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host  $host;
        proxy_set_header X-Forwarded-Port  $server_port;

        proxy_connect_timeout 5s;
        proxy_read_timeout    60s;
    }

    # --- Frontend -----------------------------------------------------------
    location / {
        proxy_pass http://medsignal_frontend;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Обновление соединения нужно для горячей перезагрузки в разработке.
        proxy_set_header Upgrade    $http_upgrade;
        proxy_set_header Connection $connection_upgrade;

        proxy_connect_timeout 5s;
        proxy_read_timeout    60s;
    }
}
