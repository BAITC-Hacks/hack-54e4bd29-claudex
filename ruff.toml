# Конфигурация линтера для кода вне backend: конвейер данных, ML, их тесты.
#
# Backend имеет собственную конфигурацию в backend/pyproject.toml и в этот
# файл не заглядывает: ruff берёт ближайшую конфигурацию к проверяемому
# файлу. Набор правил сознательно повторяет backend — расхождение стиля
# между частями одного репозитория ничем не оправдано.

line-length = 90
target-version = "py312"
extend-exclude = ["backend", "frontend"]

[lint]
select = [
    "E", "W",    # pycodestyle
    "F",         # pyflakes
    "I",         # isort
    "N",         # pep8-naming
    "UP",        # pyupgrade
    "B",         # bugbear
    "A",         # встроенные имена
    "C4",        # comprehensions
    "SIM",       # упрощения
    "TID",       # запрет относительных импортов между пакетами
    "ARG",       # неиспользуемые аргументы
    "RUF",
    "S",         # bandit: проверки безопасности
]
ignore = [
    "S101",   # assert допустим в тестах и в сужении типов
    # RUF001-003 ищут латиницу, замаскированную под кириллицу. Документация
    # и комментарии написаны по-русски, поэтому правило даёт только ложные
    # срабатывания.
    "RUF001",
    "RUF002",
    "RUF003",
]

[lint.per-file-ignores]
# ARG001 — фикстура, подключённая ради побочного эффекта, в теле теста
# не используется. Идиома pytest, а не забытый аргумент.
# S311 — псевдослучайные значения в синтетических фикстурах.
# SLF001 — тест проверяет внутреннюю функцию отчёта осознанно.
"tests/**" = ["ARG001", "S311", "SLF001"]

[lint.flake8-tidy-imports]
ban-relative-imports = "all"
