# MedSignal — локальное окружение разработки.
#
# Наружу публикуется единственный порт: 80 на обратном прокси.
# PostgreSQL, ClickHouse, Redis, MinIO и MLflow доступны только внутри
# сети контейнеров (SECURITY.md, раздел 2).
#
# Для диагностики порты хранилищ открываются явным наложением:
#   docker compose -f docker-compose.yml -f docker-compose.dev-ports.yml up -d
#   make up-devtools

name: medsignal

x-backend-environment: &backend-environment
  APP_ENV: ${APP_ENV:-local}
  APP_DEBUG: ${APP_DEBUG:-true}
  APP_SECRET: ${APP_SECRET}
  API_PREFIX: ${API_PREFIX:-/api/v1}
  LOG_LEVEL: ${LOG_LEVEL:-INFO}
  LOG_FORMAT: ${LOG_FORMAT:-json}
  CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS:-http://localhost}
  TRUSTED_HOSTS: ${TRUSTED_HOSTS:-}
  FORCE_HTTPS: ${FORCE_HTTPS:-false}

  POSTGRES_HOST: postgres
  POSTGRES_PORT: 5432
  POSTGRES_DB: ${POSTGRES_DB:-medsignal}
  POSTGRES_USER: ${POSTGRES_USER:-medsignal}
  POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
  POSTGRES_SSLMODE: ${POSTGRES_SSLMODE:-prefer}

  CLICKHOUSE_HOST: clickhouse
  CLICKHOUSE_PORT: 8123
  CLICKHOUSE_DB: ${CLICKHOUSE_DB:-medsignal_analytics}
  CLICKHOUSE_USER: ${CLICKHOUSE_USER:-medsignal}
  CLICKHOUSE_PASSWORD: ${CLICKHOUSE_PASSWORD}

  REDIS_HOST: redis
  REDIS_PORT: 6379
  REDIS_PASSWORD: ${REDIS_PASSWORD}

  MINIO_ENDPOINT: minio:9000
  MINIO_ACCESS_KEY: ${MINIO_ROOT_USER}
  MINIO_SECRET_KEY: ${MINIO_ROOT_PASSWORD}
  MINIO_SECURE: "false"

  OIDC_ISSUER: ${OIDC_ISSUER:-http://localhost/auth/realms/medsignal}
  OIDC_INTERNAL_BASE_URL: ${OIDC_INTERNAL_BASE_URL:-http://keycloak:8080/auth/realms/medsignal}
  OIDC_AUDIENCE: ${OIDC_AUDIENCE:-medsignal-api}
  OIDC_CLIENT_ID: ${OIDC_CLIENT_ID:-medsignal-frontend}
  AUTH_TEST_MODE: ${AUTH_TEST_MODE:-false}

  MLFLOW_TRACKING_URI: http://mlflow:5000
  MLFLOW_EXPERIMENT_NAME: ${MLFLOW_EXPERIMENT_NAME:-medsignal-referral-forecast}
  MLFLOW_REGISTERED_MODEL_NAME: ${MLFLOW_REGISTERED_MODEL_NAME:-medsignal-referral-flow}
  FORECAST_HORIZON_DAYS: ${FORECAST_HORIZON_DAYS:-7}
  FORECAST_MIN_TRAIN_DAYS: ${FORECAST_MIN_TRAIN_DAYS:-42}
  FORECAST_MIN_RELATIVE_IMPROVEMENT: ${FORECAST_MIN_RELATIVE_IMPROVEMENT:-0.02}

  SIGNAL_RULE_VERSION: ${SIGNAL_RULE_VERSION:-v1}
  SIGNAL_REFERRALS_MAX_AGE_HOURS: ${SIGNAL_REFERRALS_MAX_AGE_HOURS:-72}
  SIGNAL_REFUSALS_MAX_AGE_HOURS: ${SIGNAL_REFUSALS_MAX_AGE_HOURS:-72}
  SIGNAL_WAITING_MAX_AGE_HOURS: ${SIGNAL_WAITING_MAX_AGE_HOURS:-168}
  SIGNAL_SPIKE_WINDOW_DAYS: ${SIGNAL_SPIKE_WINDOW_DAYS:-7}
  SIGNAL_SPIKE_REFERENCE_WINDOWS: ${SIGNAL_SPIKE_REFERENCE_WINDOWS:-8}
  SIGNAL_WARNING_PERCENT: ${SIGNAL_WARNING_PERCENT:-20}
  SIGNAL_HIGH_PERCENT: ${SIGNAL_HIGH_PERCENT:-35}
  SIGNAL_CRITICAL_PERCENT: ${SIGNAL_CRITICAL_PERCENT:-50}
  SIGNAL_QUALITY_WARNING_PERCENT: ${SIGNAL_QUALITY_WARNING_PERCENT:-1}
  SIGNAL_QUALITY_HIGH_PERCENT: ${SIGNAL_QUALITY_HIGH_PERCENT:-5}
  SIGNAL_QUALITY_CRITICAL_PERCENT: ${SIGNAL_QUALITY_CRITICAL_PERCENT:-10}
  SIGNAL_FRESHNESS_HIGH_MULTIPLIER: ${SIGNAL_FRESHNESS_HIGH_MULTIPLIER:-2}
  SIGNAL_FRESHNESS_CRITICAL_MULTIPLIER: ${SIGNAL_FRESHNESS_CRITICAL_MULTIPLIER:-4}

  DATA_SOURCE_DIR: /data/source
  DATA_BATCH_SIZE: ${DATA_BATCH_SIZE:-50000}
  DATA_PSEUDONYMIZATION_KEY: ${DATA_PSEUDONYMIZATION_KEY}
  ANALYTICS_MIN_CELL_SIZE: ${ANALYTICS_MIN_CELL_SIZE:-10}
  ANALYTICS_CACHE_TTL_SECONDS: ${ANALYTICS_CACHE_TTL_SECONDS:-60}
  ANALYTICS_MAX_DATE_RANGE_DAYS: ${ANALYTICS_MAX_DATE_RANGE_DAYS:-366}

services:
  # --------------------------------------------------------------------
  # Граница периметра
  # --------------------------------------------------------------------
  nginx:
    image: nginx:1.27-alpine
    container_name: medsignal-nginx
    restart: unless-stopped
    ports:
      - "${HTTP_PORT:-80}:80"
    volumes:
      - ./infrastructure/nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./infrastructure/nginx/conf.d:/etc/nginx/conf.d:ro
    depends_on:
      - frontend
      - backend
      - keycloak
    networks:
      - edge
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://127.0.0.1/healthz"]
      interval: 15s
      timeout: 5s
      retries: 5

  # --------------------------------------------------------------------
  # Приложение
  # --------------------------------------------------------------------
  frontend:
    build:
      context: ./frontend
      target: development
    container_name: medsignal-frontend
    restart: unless-stopped
    environment:
      NEXT_PUBLIC_API_BASE_URL: ${NEXT_PUBLIC_API_BASE_URL:-/api/v1}
      NEXT_PUBLIC_APP_ENV: ${NEXT_PUBLIC_APP_ENV:-local}
      NEXT_PUBLIC_DISCLAIMER_ENABLED: ${NEXT_PUBLIC_DISCLAIMER_ENABLED:-true}
      WATCHPACK_POLLING: "true"
    volumes:
      # Монтируются только исходники. Корень /app остаётся во владении
      # пользователя node: иначе непривилегированный процесс не может
      # писать во внешний том и создавать файлы сборки.
      # Изменения конфигурации требуют пересборки образа.
      - ./frontend/src:/app/src
      - ./frontend/public:/app/public
    networks:
      - edge

  backend:
    build:
      context: ./backend
      target: development
    container_name: medsignal-backend
    restart: unless-stopped
    command:
      ["uvicorn", "app.main:app", "--host", "0.0.0.0", "--port", "8000", "--reload"]
    environment: *backend-environment
    volumes:
      - ./backend:/app
    depends_on:
      migrate:
        condition: service_completed_successfully
      redis:
        condition: service_healthy
      clickhouse:
        condition: service_healthy
    networks:
      - edge
      - data
    healthcheck:
      test: ["CMD", "curl", "--fail", "--silent", "http://127.0.0.1:8000/api/v1/health"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 20s

  worker:
    build:
      context: .
      dockerfile: infrastructure/ml/Dockerfile
      target: development
    container_name: medsignal-worker
    restart: unless-stopped
    # Отдельный ML-образ включает sklearn/MLflow. API остаётся лёгким,
    # а worker вызывает тот же business service через ForecastEnginePort.
    command:
      ["celery", "-A", "app.workers.celery_app:celery_app", "worker",
       "--loglevel=info", "--queues=default,ingestion,ml,simulation",
       "--concurrency=${CELERY_WORKER_CONCURRENCY:-2}"]
    environment: *backend-environment
    volumes:
      - ./backend:/opt/medsignal/backend
      - ./ml:/opt/medsignal/ml
    depends_on:
      migrate:
        condition: service_completed_successfully
      redis:
        condition: service_healthy
    networks:
      - data
    healthcheck:
      # CMD-SHELL, а не CMD: exec-форма не разворачивает переменные,
      # и проверка опрашивала бы узел с буквальным именем celery@$HOSTNAME,
      # который никогда не отвечает. Контейнер выглядел бы неисправным,
      # исправно выполняя задачи.
      test:
        ["CMD-SHELL",
         "celery -A app.workers.celery_app:celery_app inspect ping --destination celery@$$HOSTNAME"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s

  ml-runner:
    profiles: ["tools"]
    build:
      context: .
      dockerfile: infrastructure/ml/Dockerfile
      target: development
    container_name: medsignal-ml-runner
    environment: *backend-environment
    command: ["python", "-m", "app.cli.ml", "train-referrals"]
    volumes:
      - ./backend:/opt/medsignal/backend
      - ./ml:/opt/medsignal/ml
    depends_on:
      migrate:
        condition: service_completed_successfully
      clickhouse:
        condition: service_healthy
      mlflow:
        condition: service_started
    networks:
      - data
    restart: "no"

  # Одноразовая задача: миграции применяются до старта приложения,
  # отдельным шагом, а не в точке входа контейнера (DEPLOYMENT.md).
  migrate:
    build:
      context: ./backend
      target: development
    container_name: medsignal-migrate
    command: ["alembic", "upgrade", "head"]
    environment: *backend-environment
    volumes:
      - ./backend:/app
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - data
    restart: "no"

  # --------------------------------------------------------------------
  # Аутентификация
  # --------------------------------------------------------------------
  keycloak:
    image: quay.io/keycloak/keycloak:26.0
    container_name: medsignal-keycloak
    restart: unless-stopped
    command: ["start-dev", "--import-realm"]
    environment:
      KC_BOOTSTRAP_ADMIN_USERNAME: ${KEYCLOAK_ADMIN_USER:-admin}
      KC_BOOTSTRAP_ADMIN_PASSWORD: ${KEYCLOAK_ADMIN_PASSWORD}
      # Провайдер доступен браузеру по тому же адресу, что и приложение,
      # поэтому издатель токена совпадает с видимым адресом (ADR-0009).
      KC_HTTP_RELATIVE_PATH: /auth
      KC_HOSTNAME: ${KEYCLOAK_PUBLIC_URL:-http://localhost/auth}
      KC_HOSTNAME_STRICT: "false"
      KC_HTTP_ENABLED: "true"
      KC_PROXY_HEADERS: xforwarded
      KC_HEALTH_ENABLED: "true"
    volumes:
      # Монтируется только файл области: каталог содержит и документацию,
      # а Keycloak пытается импортировать всё, что найдёт.
      - ./infrastructure/keycloak/realm-medsignal-dev.json:/opt/keycloak/data/import/realm-medsignal-dev.json:ro
    networks:
      - edge

  # --------------------------------------------------------------------
  # Приватная сеть данных. Портов наружу нет.
  # --------------------------------------------------------------------
  postgres:
    image: postgres:16-alpine
    container_name: medsignal-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-medsignal}
      POSTGRES_USER: ${POSTGRES_USER:-medsignal}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      MLFLOW_DB_NAME: ${MLFLOW_DB_NAME:-mlflow}
      POSTGRES_INITDB_ARGS: "--data-checksums"
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ./database/postgres:/docker-entrypoint-initdb.d:ro
    networks:
      - data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-medsignal} -d ${POSTGRES_DB:-medsignal}"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 10s

  clickhouse:
    image: clickhouse/clickhouse-server:24.8-alpine
    container_name: medsignal-clickhouse
    restart: unless-stopped
    environment:
      CLICKHOUSE_DB: ${CLICKHOUSE_DB:-medsignal_analytics}
      CLICKHOUSE_USER: ${CLICKHOUSE_USER:-medsignal}
      CLICKHOUSE_PASSWORD: ${CLICKHOUSE_PASSWORD}
      CLICKHOUSE_DEFAULT_ACCESS_MANAGEMENT: "0"
    volumes:
      - clickhouse-data:/var/lib/clickhouse
      - ./database/clickhouse:/docker-entrypoint-initdb.d:ro
    ulimits:
      nofile: { soft: 262144, hard: 262144 }
    networks:
      - data
    healthcheck:
      # Явный IPv4: ClickHouse не слушает IPv6, а busybox wget резолвит
      # localhost в ::1 и не откатывается на IPv4.
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://127.0.0.1:8123/ping"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 15s

  redis:
    image: redis:7.4-alpine
    container_name: medsignal-redis
    restart: unless-stopped
    # Пароль обязателен даже в приватной сети: скомпрометированный
    # контейнер не должен получать доступ к очереди задач без учётных данных.
    command:
      ["redis-server", "--requirepass", "${REDIS_PASSWORD}",
       "--appendonly", "yes", "--maxmemory-policy", "noeviction"]
    volumes:
      - redis-data:/data
    networks:
      - data
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "${REDIS_PASSWORD}", "ping"]
      interval: 10s
      timeout: 5s
      retries: 10

  minio:
    image: minio/minio:RELEASE.2024-11-07T00-52-20Z
    container_name: medsignal-minio
    restart: unless-stopped
    command: ["server", "/data", "--console-address", ":9001"]
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD}
    volumes:
      - minio-data:/data
    networks:
      - data
    healthcheck:
      test: ["CMD", "curl", "--fail", "--silent", "http://127.0.0.1:9000/minio/health/live"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 10s

  # Одноразовая задача: создание бакетов при первом запуске.
  minio-init:
    image: minio/mc:RELEASE.2024-11-05T11-29-45Z
    container_name: medsignal-minio-init
    depends_on:
      minio:
        condition: service_healthy
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD}
    entrypoint: >
      /bin/sh -c "
      mc alias set local http://minio:9000 $$MINIO_ROOT_USER $$MINIO_ROOT_PASSWORD &&
      for bucket in medsignal-imports medsignal-models medsignal-exports medsignal-reports medsignal-raw medsignal-quarantine medsignal-quality medsignal-artifacts; do
        mc mb --ignore-existing local/$$bucket;
        mc anonymous set none local/$$bucket;
      done &&
      echo '[medsignal] Бакеты созданы'
      "
    networks:
      - data
    restart: "no"

  mlflow:
    build:
      context: ./infrastructure/docker
      dockerfile: mlflow.Dockerfile
    container_name: medsignal-mlflow
    restart: unless-stopped
    environment:
      MLFLOW_S3_ENDPOINT_URL: http://minio:9000
      AWS_ACCESS_KEY_ID: ${MINIO_ROOT_USER}
      AWS_SECRET_ACCESS_KEY: ${MINIO_ROOT_PASSWORD}
    command:
      - mlflow
      - server
      - --host=0.0.0.0
      - --port=5000
      - --backend-store-uri=postgresql://${POSTGRES_USER:-medsignal}:${POSTGRES_PASSWORD}@postgres:5432/${MLFLOW_DB_NAME:-mlflow}
      - --artifacts-destination=s3://medsignal-models
      - --serve-artifacts
    depends_on:
      postgres:
        condition: service_healthy
      minio-init:
        condition: service_completed_successfully
    networks:
      - data

  # --------------------------------------------------------------------
  # Загрузка данных (PHASE 3B)
  # --------------------------------------------------------------------
  # Разовый исполнитель, а не постоянный сервис: запускается командой
  # `docker compose run --rm pipeline ...`. Профиль tools исключает его
  # из обычного `docker compose up`.
  #
  # Каталог с выгрузками монтируется только на чтение. Это не пожелание,
  # а свойство монтирования: попытка изменить исходный файл отказывается
  # ядром, независимо от того, что делает код.
  pipeline:
    profiles: ["tools"]
    build:
      context: .
      dockerfile: infrastructure/pipeline/Dockerfile
    container_name: medsignal-pipeline
    environment: *backend-environment
    volumes:
      - ${DATA_SOURCE_DIR_HOST:-./data/incoming}:/data/source:ro
    depends_on:
      postgres:
        condition: service_healthy
      clickhouse:
        condition: service_healthy
      minio-init:
        condition: service_completed_successfully
    networks:
      - data
    restart: "no"

networks:
  # Прикладной контур: доступен обратному прокси.
  edge:
    driver: bridge
  # Контур данных: хранилища. Портов на хост нет.
  data:
    driver: bridge

volumes:
  postgres-data:
  clickhouse-data:
  redis-data:
  minio-data:
