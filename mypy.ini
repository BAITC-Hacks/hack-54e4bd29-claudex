# Проверка типов для кода вне backend: конвейер данных и ML.
# Backend проверяется своей конфигурацией в backend/pyproject.toml.
#
# Строгость повторяет backend: расхождение требований между частями одного
# репозитория приводит к тому, что слабая часть становится местом, куда
# переезжает вся нетипизированная логика.

[mypy]
python_version = 3.12
warn_unused_configs = True
warn_redundant_casts = True
warn_unused_ignores = True
disallow_untyped_defs = True
disallow_incomplete_defs = True
check_untyped_defs = True
no_implicit_optional = True
strict_equality = True
ignore_missing_imports = True
exclude = (^backend/|^frontend/)

[mypy-tests.*]
disallow_untyped_defs = False
